name: Maven build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: 'maven'
      - name: Determine build module
        run: |
          REF="${{ github.ref_name }}"
          echo "REF=$REF"
          if echo "$REF" | grep -q "26.2"; then
            echo "MODULES=-pl versions/26.2/JailPlugin -am" >> $GITHUB_ENV
          else
            echo "MODULES=-pl versions/1.21.11/JailPlugin -am" >> $GITHUB_ENV
          fi
      - name: Build with Maven
        run: mvn -f parent-pom.xml -B $MODULES clean package
      - name: Set artifact name
        run: echo "ARTIFACT_NAME=$(echo '${{ github.ref_name }}' | tr '/' '-')" >> $GITHUB_ENV
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          # Use branch or tag name (sanitized) so artifacts reflect the current ref.
          name: ${{ env.ARTIFACT_NAME }}
          path: versions/**/target/*.jar
