name: Maven build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: 'maven'
      - name: Build with Maven
        run: mvn -f parent-pom.xml -B clean package
      - name: Set artifact name
        run: echo "ARTIFACT_NAME=$(echo '${{ github.ref_name }}' | tr '/' '-')" >> $GITHUB_ENV
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          # Use branch or tag name (sanitized) so artifacts reflect the current ref.
          name: ${{ env.ARTIFACT_NAME }}
          path: versions/**/target/*.jar
